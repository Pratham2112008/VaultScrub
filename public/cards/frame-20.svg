  <line x1="36" y1="104" x2="684" y2="104" stroke="rgba(244,242,239,0.12)" stroke-width="1"/>
  <text x="68" y="154" fill="#f4f2ef" font-family="Georgia, serif" font-size="34" letter-spacing="1">ZERO-TRUST ENFORCED</text>
  <text x="68" y="250" fill="#e5e0da" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22">Content-Security-Policy:</text>
  <text x="68" y="296" fill="#e5e0da" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22">  default-src 'self';</text>
  <text x="68" y="342" fill="#e5e0da" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22">  script-src  'self';</text>
  <text x="68" y="388" fill="#e5e0da" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22">  style-src   'self';</text>
  <text x="68" y="434" fill="#e5e0da" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22">  connect-src 'self';</text>
  <text x="68" y="480" fill="#e5e0da" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22">  worker-src  'self' blob:;</text>
  <text x="68" y="526" fill="#e5e0da" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22">  object-src  'none';</text>
  <text x="68" y="572" fill="#e5e0da" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22"></text>
  <text x="68" y="618" fill="#8c8783" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22">// Network requests: 0</text>
  <text x="68" y="664" fill="#8c8783" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22">// Bytes transmitted: 0 B</text>
